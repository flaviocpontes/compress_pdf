name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # manual run: builds binaries but does not create a release

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Build binary
        run: uv run pyinstaller --onefile --name compress-pdf-${{ matrix.target }} main.py
      - uses: actions/upload-artifact@v7
        with:
          name: compress-pdf-${{ matrix.target }}
          path: dist/compress-pdf-${{ matrix.target }}*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/compress-pdf-*
          generate_release_notes: true
