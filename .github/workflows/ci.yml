name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv run tests.py

  sonar:
    needs: test
    # fork PRs have no access to secrets — skip instead of failing
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: main # SONAR_URL (var) and SONAR_TOKEN (secret) live here
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for new-code detection and PR decoration
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_URL }}
